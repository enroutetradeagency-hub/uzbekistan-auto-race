# Android CI: main branchga yuborilgan har bir o‘yin buildi debug APK artefaktini hosil qiladi.
name: Android APK
"on":
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK turi"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
  push:
    branches: [main]
    paths:
      - "client/**"
      - "android/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_VERSION: "21"
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "35.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Android SDK API 36
        uses: android-actions/setup-android@v3

      - name: Install Android build requirements
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Build web game and sync Android
        run: pnpm android:sync

      - name: Assemble debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: uzbekistan-auto-race-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Assemble unsigned release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload unsigned release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: uzbekistan-auto-race-unsigned-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
